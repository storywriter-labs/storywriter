name: Deploy Frontend

# INFRASTRUCTURE MANAGEMENT:
# This workflow intelligently manages infrastructure using Terraform:
# - If no Terraform state exists, it will create/import infrastructure automatically
# - If state exists but resources have drifted, it will apply corrections
# - If state is current, it skips infrastructure changes and proceeds to deployment

on:
  push:
    branches: [ main ]
    # Semver-shaped release tags only. A glob is the closest GitHub gets to
    # validating semver, so `v1.2.3-rc1` still matches — but `vnext` and other
    # stray v-tags no longer deploy production.
    tags: [ 'v[0-9]*.[0-9]*.[0-9]*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

permissions:
  id-token: write
  contents: read

# Staging and production have separate AWS roles, and every job below that
# touches AWS declares `environment:` to pick up the right one. Don't remove
# that key to save an approval prompt: the production role's trust policy
# matches on `environment:production`, and GitHub only puts that claim in the
# OIDC token for jobs that declare it. See terraform/github-oidc/README.md.

# One deploy at a time per environment: queued runs wait instead of racing a
# deploy already in flight (never cancel a deploy mid-run).
concurrency:
  group: deploy-frontend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  AWS_REGION: us-east-1

jobs:
  # Determine environment based on branch or manual input
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      terraform_dir: ${{ steps.set-env.outputs.terraform_dir }}
    steps:
      # The manual-dispatch ref picker defaults to main, and the environment
      # dropdown is taken at face value below — so without this, dispatching
      # `production` from main ships unreleased code to storywriter.net. Fail
      # fast unless a release tag was picked as the ref.
      - name: Require a release tag for production
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.environment == 'production'
          && !(github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        run: |
          echo "::error::Production deploys only run from v* release tags. Re-run the workflow and pick a release tag in the ref dropdown (it defaults to main)."
          exit 1

      - name: Set environment variables
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="production"
          else
            ENV="staging"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "terraform_dir=terraform/frontend-${ENV}" >> $GITHUB_OUTPUT

  # Infrastructure management phase (creates/validates infrastructure)
  infrastructure:
    needs: [setup]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    outputs:
      s3_bucket: ${{ steps.terraform.outputs.s3_bucket_name }}
      cloudfront_id: ${{ steps.terraform.outputs.cloudfront_distribution_id }}
      domain: ${{ steps.terraform.outputs.domain_name }}
      cloudfront_domain: ${{ steps.terraform.outputs.cloudfront_domain_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.0"
          terraform_wrapper: false
          
      - name: Ensure Terraform directory exists
        run: |
          if [ ! -d "${{ needs.setup.outputs.terraform_dir }}" ]; then
            echo "❌ Terraform directory for ${{ needs.setup.outputs.environment }} does not exist"
            echo "Expected directory: ${{ needs.setup.outputs.terraform_dir }}"
            echo "Please run Terraform manually to create infrastructure first"
            exit 1
          fi
          echo "✅ Using existing Terraform directory: ${{ needs.setup.outputs.terraform_dir }}"
          
      - name: Backup Terraform state
        working-directory: ${{ needs.setup.outputs.terraform_dir }}
        run: |
          if [ -f "terraform.tfstate" ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            cp terraform.tfstate "terraform.tfstate.backup-${TIMESTAMP}"
            echo "✅ Terraform state backed up to terraform.tfstate.backup-${TIMESTAMP}"
          else
            echo "ℹ️  No existing Terraform state found"
          fi
          
      - name: Terraform Init
        working-directory: ${{ needs.setup.outputs.terraform_dir }}
        run: terraform init
        
      - name: Set Terraform variables
        working-directory: ${{ needs.setup.outputs.terraform_dir }}
        env:
          STAGING_ALLOWED_VIEWER_IPS: ${{ secrets.STAGING_ALLOWED_VIEWER_IPS }}
        run: |
          if [ "${{ needs.setup.outputs.environment }}" = "production" ]; then
            DOMAIN_NAME="storywriter.net"
            S3_BUCKET="storywriter-production-frontend"
          else
            DOMAIN_NAME="staging.storywriter.net"
            S3_BUCKET="storywriter-staging-frontend"
          fi

          echo "TF_VAR_environment=${{ needs.setup.outputs.environment }}" >> $GITHUB_ENV
          echo "TF_VAR_domain_name=${DOMAIN_NAME}" >> $GITHUB_ENV
          echo "TF_VAR_s3_bucket_name=${S3_BUCKET}" >> $GITHUB_ENV

          # Staging is private: a CloudFront function 403s any viewer whose
          # address is not in allowed_viewer_ips. The real terraform.tfvars is
          # gitignored (it holds a home IP), so the runner has to be told the
          # list or the variable falls back to its [] default -- which deletes
          # the function and quietly serves staging to the whole internet.
          #
          # The secret holds a JSON list, e.g. ["203.0.113.10"]. TF_VAR_ ranks
          # below terraform.tfvars in Terraform's precedence order, so this
          # never overrides a local file when you apply by hand.
          #
          # Production gets no list at all. It is meant to be public.
          if [ "${{ needs.setup.outputs.environment }}" != "production" ]; then
            if [ -z "${STAGING_ALLOWED_VIEWER_IPS}" ]; then
              echo "❌ Secret STAGING_ALLOWED_VIEWER_IPS is not set."
              echo "   Staging would be deployed with no viewer allowlist and served publicly."
              echo "   Set it to a JSON list of addresses, e.g. [\"203.0.113.10\"]."
              echo "   To open staging on purpose, set it to the literal [] instead of leaving it blank."
              exit 1
            fi
            echo "TF_VAR_allowed_viewer_ips=${STAGING_ALLOWED_VIEWER_IPS}" >> $GITHUB_ENV
          fi

      - name: Terraform Plan - Infrastructure Validation
        working-directory: ${{ needs.setup.outputs.terraform_dir }}
        run: |
          echo "🔍 Validating infrastructure state..."
          
          # Check if remote state has resources
          RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo 0)

          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "⚠️  No resources found in Terraform state"
            echo "Running terraform apply to create infrastructure..."
            terraform apply -auto-approve
            echo "✅ Infrastructure created successfully"
          else
            echo "📋 Found $RESOURCE_COUNT resources in state"
            # Validate with plan
            EXIT_CODE=0
            terraform plan -detailed-exitcode || EXIT_CODE=$?

            case $EXIT_CODE in
              0)
                echo "✅ Infrastructure state is correct - no changes needed"
                ;;
              1)
                echo "❌ Terraform plan failed"
                exit 1
                ;;
              2)
                echo "⚠️  Infrastructure drift detected"
                echo "Applying changes to align infrastructure with desired state..."
                terraform apply -auto-approve
                echo "✅ Infrastructure updated successfully"
                ;;
              *)
                echo "❌ Unknown exit code from terraform plan: $EXIT_CODE"
                exit 1
                ;;
            esac
          fi
          
      - name: Extract Terraform Outputs
        id: terraform
        working-directory: ${{ needs.setup.outputs.terraform_dir }}
        run: |
          echo "📊 Extracting infrastructure resource identifiers..."
          
          # Export outputs for use in later jobs
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "domain_name=$(terraform output -raw domain_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_domain_name=$(terraform output -raw cloudfront_domain_name)" >> $GITHUB_OUTPUT
          
          echo "📋 Infrastructure Resources:"
          echo "- S3 Bucket: $(terraform output -raw s3_bucket_name)"
          echo "- CloudFront Distribution: $(terraform output -raw cloudfront_distribution_id)"
          echo "- Domain: $(terraform output -raw domain_name)"
          echo "- CloudFront Domain: $(terraform output -raw cloudfront_domain_name)"
          
      - name: Validate Infrastructure State
        working-directory: ${{ needs.setup.outputs.terraform_dir }}
        run: |
          echo "🔍 Validating infrastructure state..."
          
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          
          # Validate S3 bucket exists and is accessible
          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket $S3_BUCKET is accessible"
          else
            echo "❌ S3 bucket $S3_BUCKET is not accessible"
            exit 1
          fi
          
          # Validate CloudFront distribution exists
          if aws cloudfront get-distribution --id "$CF_DIST_ID" >/dev/null 2>&1; then
            echo "✅ CloudFront distribution $CF_DIST_ID exists"
          else
            echo "❌ CloudFront distribution $CF_DIST_ID not found"
            exit 1
          fi
          
          echo "✅ Infrastructure validation completed successfully"

  # Test and validation phase
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run type-check
        
      - name: Run linting
        run: npm run lint
        
      - name: Run tests
        run: npm run test
        
      - name: Cache test results
        uses: actions/cache@v6
        with:
          path: |
            coverage/
            test-results/
          key: test-results-${{ github.sha }}

  # Build phase
  build:
    needs: [setup, infrastructure, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web application
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || (needs.setup.outputs.environment == 'production' && 'https://api.storywriter.net' || 'https://staging-api.storywriter.net') }}
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          # Temporary: production is invite-only, so that build hides sign-up
          # behind "Request Invite". Staging stays open. Delete this line (and
          # frontend/constants/prerelease.ts) to open public sign-up.
          PRERELEASE_GATE: ${{ needs.setup.outputs.environment == 'production' }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ "$API_BASE_URL" = "null" ]; then
            echo "⚠️  API_BASE_URL environment variable not set, using default"
            if [ "$ENVIRONMENT" = "production" ]; then
              export API_BASE_URL="https://api.storywriter.net"
            else
              export API_BASE_URL="https://staging-api.storywriter.net"
            fi
          fi
          echo "Building with API_BASE_URL: $API_BASE_URL"
          if [ -z "$POSTHOG_API_KEY" ] || [ "$POSTHOG_API_KEY" = "null" ]; then
            echo "⚠️  POSTHOG_API_KEY not set for this environment — analytics will be disabled in this build"
          fi
          npx expo export --platform web --output-dir dist
          
      - name: Validate build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          
          echo "✅ Build validation passed"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ needs.setup.outputs.environment }}
          path: dist/
          retention-days: 7

  # Backend connectivity test
  connectivity-test:
    needs: [setup, infrastructure, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Test backend connectivity
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          # Use environment variable or fall back to defaults
          API_URL="${{ vars.API_BASE_URL }}"
          if [ -z "$API_URL" ] || [ "$API_URL" = "null" ]; then
            echo "⚠️  API_BASE_URL environment variable not set, using default"
            if [ "$ENVIRONMENT" = "production" ]; then
              API_URL="https://api.storywriter.net"
            else
              API_URL="https://staging-api.storywriter.net"
            fi
          fi

          echo "Testing connectivity to $API_URL"

          # Test health endpoint with timeout
          if curl -f -m 10 "$API_URL/api/v1/health"; then
            echo "✅ Backend connectivity test passed"
          else
            echo "⚠️ Backend connectivity test failed - continuing with deployment"
            echo "Backend may not be ready yet, but frontend can still be deployed"
          fi

  # Deployment phase
  deploy:
    needs: [setup, infrastructure, build, connectivity-test]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: frontend-build-${{ needs.setup.outputs.environment }}
          path: dist/
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Create deployment backup
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_KEY="backups/${{ needs.setup.outputs.environment }}/${TIMESTAMP}/"

          echo "Creating backup at s3://${{ needs.infrastructure.outputs.s3_bucket }}/${BACKUP_KEY}"
          aws s3 sync s3://${{ needs.infrastructure.outputs.s3_bucket }}/ s3://${{ needs.infrastructure.outputs.s3_bucket }}/${BACKUP_KEY} --exclude "backups/*" || echo "No existing files to backup"

          echo "BACKUP_KEY=${BACKUP_KEY}" >> $GITHUB_ENV
          
      - name: Deploy to S3
        run: |
          echo "Deploying to s3://${{ needs.infrastructure.outputs.s3_bucket }}"
          aws s3 sync ./dist s3://${{ needs.infrastructure.outputs.s3_bucket }}/ --delete --cache-control "public, max-age=31536000" --exclude "*.html"
          aws s3 sync ./dist s3://${{ needs.infrastructure.outputs.s3_bucket }}/ --cache-control "public, max-age=0, must-revalidate" --include "*.html"
          
      - name: Invalidate CloudFront distribution
        id: invalidate
        run: |
          echo "Invalidating CloudFront distribution: ${{ needs.infrastructure.outputs.cloudfront_id }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infrastructure.outputs.cloudfront_id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "invalidation_id=${INVALIDATION_ID}" >> $GITHUB_OUTPUT
          echo "Invalidation created with ID: ${INVALIDATION_ID}"

      - name: Wait for CloudFront invalidation
        run: |
          echo "Waiting for CloudFront invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ needs.infrastructure.outputs.cloudfront_id }} \
            --id ${{ steps.invalidate.outputs.invalidation_id }}
          echo "✅ CloudFront invalidation completed"

  # Post-deployment verification
  verify-deployment:
    needs: [setup, infrastructure, deploy]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      # Staging and production are checked for different things, because they
      # are not equally reachable from here.
      #
      # Production is public, so a 200 is the answer.
      #
      # Staging is held to a short list of viewer IPs by a CloudFront function
      # (terraform/frontend-staging/functions/ip-allowlist.js), and a GitHub
      # runner will never be on that list -- GitHub's address ranges are far too
      # many and too broad to allowlist without giving the whole internet in
      # with them. So the runner cannot see the site, and asking for a 200 here
      # only tests that we forgot to lock it down.
      #
      # A 403 carrying the function's own message is the useful check instead.
      # It proves two things at once: CloudFront is serving the distribution,
      # and the allowlist is live. Origin errors cannot be mistaken for it --
      # the distribution maps an origin 403 to index.html with a 200, so a 403
      # reaching the viewer can only have come from the function.
      #
      # This means CI no longer confirms the new bundle is what gets served.
      # The `deploy` job's S3 sync is what that rests on now.
      - name: Verify deployment
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          DOMAIN: ${{ needs.infrastructure.outputs.domain }}
          CF_DOMAIN: ${{ needs.infrastructure.outputs.cloudfront_domain }}
        run: |
          echo "Verifying deployment at https://${DOMAIN}"
          echo "CloudFront domain: ${CF_DOMAIN}"

          # Wait a moment for DNS propagation
          sleep 30

          # Prints the status code, leaves the body in /tmp/verify-body.
          status_of() {
            curl -s -m 10 -o /tmp/verify-body -w '%{http_code}' "$1" || echo "000"
          }

          if [ "${ENVIRONMENT}" = "production" ]; then
            echo "Testing custom domain..."
            if curl -f -m 10 -o /dev/null -s "https://${DOMAIN}"; then
              echo "✅ Custom domain deployment verification passed"
            else
              echo "⚠️  Custom domain test failed, testing CloudFront domain..."
              if curl -f -m 10 -o /dev/null -s "https://${CF_DOMAIN}"; then
                echo "✅ CloudFront domain accessible (DNS may need more time)"
              else
                echo "❌ Deployment verification failed on both domains"
                exit 1
              fi
            fi
            exit 0
          fi

          echo "Staging is IP-restricted. Expecting a 403 from the allowlist function."
          STATUS=$(status_of "https://${DOMAIN}")
          BODY=$(cat /tmp/verify-body)

          case "${STATUS}" in
            403)
              if echo "${BODY}" | grep -q "restricted to approved addresses"; then
                echo "✅ CloudFront is serving and the viewer allowlist is live"
              else
                echo "❌ Got a 403, but not from the allowlist function."
                echo "   Body was: ${BODY}"
                exit 1
              fi
              ;;
            200)
              echo "❌ staging.storywriter.net answered a GitHub runner with a 200."
              echo "   The viewer allowlist is not in force -- staging is public."
              echo "   Check allowed_viewer_ips and the STAGING_ALLOWED_VIEWER_IPS secret."
              exit 1
              ;;
            000)
              echo "❌ No response from https://${DOMAIN} within 10s"
              exit 1
              ;;
            *)
              echo "❌ Unexpected status ${STATUS} from https://${DOMAIN}"
              echo "   Body was: ${BODY}"
              exit 1
              ;;
          esac

      - name: Verify Terraform state consistency
        run: |
          # This would typically involve checking that deployed resources match Terraform state
          echo "✅ Terraform state consistency check would be implemented here"
          echo "Current deployment uses Terraform-managed resources:"
          echo "- S3 Bucket: ${{ needs.infrastructure.outputs.s3_bucket }}"
          echo "- CloudFront: ${{ needs.infrastructure.outputs.cloudfront_id }}"
          echo "- Domain: ${{ needs.infrastructure.outputs.domain }}"
          
      - name: Test backend connectivity from deployed frontend
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          # Use environment variable or fall back to defaults
          API_URL="${{ vars.API_BASE_URL }}"
          if [ -z "$API_URL" ] || [ "$API_URL" = "null" ]; then
            echo "⚠️  API_BASE_URL environment variable not set, using default"
            if [ "$ENVIRONMENT" = "production" ]; then
              API_URL="https://api.storywriter.net"
            else
              API_URL="https://staging-api.storywriter.net"
            fi
          fi

          echo "Testing API connectivity from deployed frontend"
          # This would typically involve running browser tests
          # For now, we'll just test the API endpoint directly
          if curl -f -m 10 "$API_URL/api/v1/health"; then
            echo "✅ Backend API is accessible from deployment environment"
          else
            echo "⚠️ Backend API test failed - may need manual verification"
          fi

  # Rollback capability (manual trigger only)
  rollback:
    if: failure() && github.event_name == 'workflow_dispatch'
    needs: [setup, infrastructure, deploy]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: List available backups
        run: |
          echo "Available backups:"
          aws s3 ls s3://${{ needs.infrastructure.outputs.s3_bucket }}/backups/${{ needs.setup.outputs.environment }}/ || echo "No backups found"
          
      - name: Rollback deployment
        run: |
          # Get the most recent backup
          LATEST_BACKUP=$(aws s3 ls s3://${{ needs.infrastructure.outputs.s3_bucket }}/backups/${{ needs.setup.outputs.environment }}/ | sort | tail -n 1 | awk '{print $2}')
          
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Rolling back to backup: $LATEST_BACKUP"
            aws s3 sync s3://${{ needs.infrastructure.outputs.s3_bucket }}/backups/${{ needs.setup.outputs.environment }}/${LATEST_BACKUP} s3://${{ needs.infrastructure.outputs.s3_bucket }}/ --delete
            
            # Invalidate CloudFront
            aws cloudfront create-invalidation \
              --distribution-id ${{ needs.infrastructure.outputs.cloudfront_id }} \
              --paths "/*"
              
            echo "✅ Rollback completed"
          else
            echo "❌ No backup found for rollback"
            exit 1
          fi